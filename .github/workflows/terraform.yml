name: Terraform Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  terraform-plan:
    uses: pratik-khot/github-common-workflows/.github/workflows/terraform-plan.yml@v1.1.2
    with:
      aws-region: ${{ vars.aws_region }}
    secrets: inherit
  
  terraform-apply:
    needs: 
      - terraform-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: pratik-khot/github-common-workflows/.github/workflows/terraform-apply.yml@v1.1.2
    with:
      aws-region: ${{ vars.aws_region }}
      environment: dev
    secrets: inherit